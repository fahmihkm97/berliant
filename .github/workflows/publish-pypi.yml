name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish
        required: true
        default: v0.1.0

  release:
    types: [published]

jobs:
  publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/berliant

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download GitHub Release distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist

          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --pattern "SHA256SUMS" \
            --dir dist

      - name: Verify release checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          rm SHA256SUMS

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verify-metadata: true
          attestations: true
