[project]
name = "berliant"
version = "0.1.0"
description = "Stochastic capability-interaction discovery for failure-inducing capability combinations"
readme = "README.md"
authors = [{ name = "fahmihkm97" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260724",
]
